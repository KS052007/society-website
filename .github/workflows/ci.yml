name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test, Build & Budgets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (Strict TS)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build Application (Vite)
        run: npm run build

      - name: Enforce Performance Budgets
        run: npm run check-budgets
